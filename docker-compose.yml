services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis:6379
    ports:
      - "${API_PORT:-8081}:${API_PORT:-8081}"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
